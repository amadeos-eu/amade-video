dvd-css.title=Verschlüsselte DVDs
dvd-css.failed=Die DVD konnte nicht abgespielt werden. Gekaufte DVDs sind meist verschlüsselt, und libdvdcss,\ndie Bibliothek zum Entschlüsseln, ist auf diesem Computer nicht installiert.
dvd-css.missing=libdvdcss ist auf diesem Computer nicht installiert, daher spielt der Videoplayer nur\nunverschlüsselte DVDs ab.
dvd-css.installed=libdvdcss ist installiert: Der Videoplayer kann verschlüsselte DVDs abspielen.
dvd-css.text=Die meisten gekauften DVDs sind verschlüsselt. Um sie abzuspielen, braucht der Videoplayer die\nBibliothek libdvdcss. amadeOS installiert sie nicht, weil das Umgehen eines Kopierschutzes in\nmanchen Ländern, auch in Deutschland, nicht erlaubt ist. Informieren Sie sich, was bei Ihnen gilt.\n\nDebian hat kein Paket libdvdcss. Sein Hilfspaket libdvd-pkg lädt den Quellcode von VideoLAN\nherunter und baut die Bibliothek auf Ihrem Computer. Geben Sie diese zwei Befehle in einem\nTerminal ein:
dvd-css.after=Antworten Sie mit „Ja“, wenn nach automatischen Aktualisierungen gefragt wird, und starten Sie\ndann den Videoplayer neu. Selbst gebrannte DVDs laufen auch ohne libdvdcss.
