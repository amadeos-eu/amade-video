dvd-css.title=DVD protetti
dvd-css.failed=Non è stato possibile riprodurre il DVD. I DVD acquistati di solito sono cifrati, e libdvdcss,\nla libreria che li decifra, non è installata su questo computer.
dvd-css.missing=libdvdcss non è installata su questo computer, quindi il lettore video riproduce solo\nDVD non cifrati.
dvd-css.installed=libdvdcss è installata: il lettore video può riprodurre DVD cifrati.
dvd-css.text=La maggior parte dei DVD acquistati è cifrata. Per riprodurli il lettore video ha bisogno della\nlibreria libdvdcss. amadeOS non la installa perché in alcuni paesi, tra cui la Germania, aggirare\nuna protezione dalla copia non è consentito. Informatevi su ciò che vale dove vivete.\n\nDebian non ha un pacchetto libdvdcss. Il suo pacchetto di supporto libdvd-pkg scarica il codice\nsorgente da VideoLAN e compila la libreria sul vostro computer. Digitate questi due comandi in un terminale:
dvd-css.after=Rispondete «Sì» alla domanda sugli aggiornamenti automatici, poi riavviate il lettore video.\nI DVD fatti in casa si riproducono senza libdvdcss.
