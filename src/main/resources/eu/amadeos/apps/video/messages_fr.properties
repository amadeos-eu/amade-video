dvd-css.title=DVD chiffrés
dvd-css.failed=Le DVD n'a pas pu être lu. Les DVD du commerce sont généralement chiffrés, et libdvdcss,\nla bibliothèque qui les déchiffre, n'est pas installée sur cet ordinateur.
dvd-css.missing=libdvdcss n'est pas installée sur cet ordinateur : le lecteur vidéo ne lit que les DVD\nnon chiffrés.
dvd-css.installed=libdvdcss est installée : le lecteur vidéo peut lire les DVD chiffrés.
dvd-css.text=La plupart des DVD du commerce sont chiffrés. Pour les lire, le lecteur vidéo a besoin de la\nbibliothèque libdvdcss. amadeOS ne l'installe pas, car dans certains pays, dont l'Allemagne,\ncontourner une protection contre la copie est interdit. Renseignez-vous sur ce qui s'applique chez vous.\n\nDebian n'a pas de paquet libdvdcss. Son paquet d'aide libdvd-pkg télécharge le code source depuis\nVideoLAN et compile la bibliothèque sur votre ordinateur. Tapez ces deux commandes dans un terminal :
dvd-css.after=Répondez « Oui » à la question sur les mises à jour automatiques, puis relancez le lecteur vidéo.\nLes DVD faits maison se lisent sans libdvdcss.
