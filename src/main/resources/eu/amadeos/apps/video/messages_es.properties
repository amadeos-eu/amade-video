dvd-css.failed=No se pudo reproducir el DVD. Los DVD comprados suelen estar cifrados, y libdvdcss,\nla biblioteca que los descifra, no está instalada en este ordenador.
dvd-css.missing=libdvdcss no está instalada en este ordenador, así que el reproductor de vídeo solo\nreproduce DVD sin cifrar.
dvd-css.installed=libdvdcss está instalada: el reproductor de vídeo puede reproducir DVD cifrados.
dvd-css.text=La mayoría de los DVD comprados están cifrados. Para reproducirlos, el reproductor de vídeo\nnecesita la biblioteca libdvdcss. amadeOS no la instala porque en algunos países, entre ellos\nAlemania, no está permitido eludir la protección anticopia. Infórmese de lo que rige donde vive.\n\nDebian no tiene un paquete libdvdcss. Su paquete auxiliar libdvd-pkg descarga el código fuente\nde VideoLAN y compila la biblioteca en su ordenador. Escriba estas dos órdenes en un terminal:
dvd-css.after=Responda «Sí» cuando se le pregunte por las actualizaciones automáticas y vuelva a abrir el\nreproductor de vídeo. Los DVD caseros se reproducen sin libdvdcss.
