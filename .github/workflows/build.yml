name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The unit tests do not need libmpv or a display.
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Check that the tests ran
        run: |
          count=$(grep -ho 'tests="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          skipped=$(grep -ho 'skipped="[0-9]*"' build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "Tests run: $count, skipped: $skipped"
          test "$count" -ge 20
          test "$skipped" -eq 0
      - name: Package
        run: ./gradlew jar deb --no-daemon
      - name: Check the fat jar and the package
        run: |
          jar=$(ls build/libs/amade-video-*.jar)
          unzip -l "$jar" | grep -q 'com/sun/jna/Native.class'
          unzip -p "$jar" META-INF/services/org.slf4j.spi.SLF4JServiceProvider | grep -q logback
          dpkg-deb --info build/distributions/amade-video_*_all.deb | grep -q 'Depends:.*libmpv2'
          dpkg-deb --contents build/distributions/amade-video_*_all.deb | grep -q usr/share/applications/amade-video.desktop
          dpkg-deb --contents build/distributions/amade-video_*_all.deb | grep -q usr/bin/amade-video
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
